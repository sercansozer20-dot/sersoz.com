<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dersler | VisionCap</title>
<meta name="description" content="VisionCap derslerini tarayıcıda dene: canlı kamera görüntüsü üzerinde gri tonlama, eşikleme, bulanıklaştırma, kenar bulma ve daha fazlası; bilgi kartları ve makale özetleri.">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f0f6fc' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%233fb950'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="visioncap.css">
<style>
  #uygulama { max-width: 560px; margin: 0 auto; padding: 0 16px 56px; display: flex; flex-direction: column; gap: 12px; }
  #uygulama h1 { font-size: 28px; margin: 4px 0 0; line-height: 1.15; }
  #uygulama h2 { font-size: 20px; margin: 12px 0 0; }
  .kart { display: flex; flex-direction: column; gap: 4px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 16px; padding: 14px 16px; text-decoration: none; }
  .kart small, .adim small, .rozet small { color: var(--soluk); font-size: 13px; }
  .seri-kart { text-align: center; background: var(--kart); border-radius: 20px; padding: 22px 0 16px; }
  .seri-kart span { display: block; color: var(--turuncu); font-size: 64px; font-weight: 800; line-height: 1; }
  .seri-kart small { color: var(--soluk); }
  .uclu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .uclu .kart { align-items: center; }
  .uclu strong { font-size: 22px; }
  .cubuk { height: 8px; background: var(--kenar); border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .cubuk i { display: block; height: 100%; background: var(--yesil); }
  .gorev { border-color: var(--mavi); }
  .gorev em, .ipucu em { color: var(--mavi); font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
  .gorev strong { font-size: 17px; }
  .rozetler { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .rozet { flex: none; width: 124px; background: var(--kart); border: 1px solid var(--yesil); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .kilitli { opacity: .35; border-color: var(--kenar); }
  .yol { display: flex; flex-direction: column; gap: 10px; }
  .adim { display: flex; align-items: center; gap: 12px; background: var(--kart); border-radius: 16px; padding: 12px 14px; text-decoration: none; }
  .adim > i { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; background: var(--kenar); }
  .adim.bitti > i { background: var(--yesil); }
  .adim span { display: flex; flex-direction: column; }
  a.adim:hover, a.kart:hover { border-color: var(--soluk); }

  .geri-ic { color: var(--mavi); text-decoration: none; font-size: 17px; }
  .anlatim { margin: 0; color: #c9d1d9; }
  .formul { background: var(--kart); border: 1px solid var(--kenar); border-radius: 12px; padding: 12px; color: var(--turuncu); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sahne { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; }
  .sahne canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .durum { position: absolute; left: 12px; right: 12px; bottom: 12px; margin: 0; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .durum:empty { display: none; }
  .kucuk { margin: -4px 0 0; color: var(--soluk); font-size: 12px; text-align: center; }
  .ayarlar { display: flex; flex-direction: column; gap: 10px; }
  .ayar { display: flex; flex-direction: column; gap: 6px; background: var(--kart); border-radius: 12px; padding: 12px; }
  .ayar span { display: flex; justify-content: space-between; }
  .ayar output { color: var(--yesil); font-variant-numeric: tabular-nums; }
  .ayar input { width: 100%; accent-color: var(--yesil); }
  .ipucu { background: var(--kart); border-left: 3px solid var(--mavi); border-radius: 12px; padding: 12px; }
  .ipucu p { margin: 4px 0 0; color: #c9d1d9; }
  .dugme { font: inherit; font-weight: 700; color: #fff; background: var(--yesil); border: 0; border-radius: 14px; padding: 15px; cursor: pointer; }
  .dugme:disabled { opacity: .4; cursor: default; }
  .dugme.tamam { background: transparent; color: var(--yesil); opacity: 1; }
  .not-web { color: var(--soluk); font-size: 13px; text-align: center; margin: 8px 0 0; }
  button.kart { font: inherit; color: inherit; text-align: left; cursor: pointer; }
  /* iOS uygulamasında tanıtım bağlantısı gizlenir, alt bilgi kalır (gizlilik ve destek) */
  .native .ust .geri, .native .not-web { display: none; }
  .native .ust { padding-top: max(22px, env(safe-area-inset-top)); }

  /* 1.1: sekmeler, kartlar, gelişim, Pro, katman */
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .sekmeler { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(11, 15, 20, .94); border-top: 1px solid var(--kenar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .sekmeler[hidden] { display: none; }
  .sekmeler a { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--soluk); text-decoration: none; font-size: 11px; font-weight: 600; }
  .sekmeler svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sekmeler a.secili { color: var(--yesil); }
  .alt-metin { margin: -4px 0 0; color: var(--soluk); }
  #uygulama h2 small { color: var(--soluk); font-size: 14px; font-weight: 500; margin-left: 6px; }
  .salla { border-color: var(--turuncu); }
  .salla em, .pro-bant em, .etiket, .pro-ust em, .onem em { color: var(--turuncu); font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
  .pro-bant { border-color: #a371f7; background: linear-gradient(135deg, #1d1530, var(--kart)); }
  .pro-bant em, .pro-ust em { color: #c297ff; }
  .pro-rozet { align-self: flex-end; margin: 0 0 -4px; background: #a371f7; color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .1em; padding: 3px 8px; border-radius: 999px; }
  .pro-cip { margin-left: auto; flex: none; background: #2a1f45; color: #c297ff; font-size: 11px; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; }
  .adim.pro-kilit { opacity: .8; }
  button.adim { font: inherit; color: inherit; text-align: left; border: 0; width: 100%; cursor: pointer; }
  .akis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .akis li { display: flex; align-items: center; gap: 10px; background: var(--kart); border-radius: 12px; padding: 10px 12px; }
  .akis i { font-style: normal; font-size: 18px; }
  .akis span { flex: 1; }
  .akis small, .bos { color: var(--soluk); font-size: 12px; }
  .tumu { color: var(--mavi); text-decoration: none; font-size: 15px; }
  .kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .mini { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 92px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 14px; padding: 12px; }
  .mini em { color: var(--turuncu); font-style: normal; font-size: 11px; font-weight: 700; }
  .mini strong { font-size: 14px; line-height: 1.3; }
  .mini.kapali { align-items: center; justify-content: center; cursor: default; color: var(--kenar); border-style: dashed; }
  .mini.kapali strong { font-size: 28px; }
  .makale > i { font-size: 13px; }
  .sayaclar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .sayaclar strong { font-size: 22px; }
  .grafik { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin: 10px 0 4px; }
  .grafik div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .grafik span { width: 100%; min-height: 3px; background: var(--yesil); border-radius: 6px 6px 2px 2px; }
  .grafik small { font-size: 11px; }
  .pro-ust h1 { margin-top: 4px !important; }
  .artilar { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .artilar li { display: flex; flex-direction: column; background: var(--kart); border-radius: 12px; padding: 12px 14px; }
  .artilar li b::before { content: "✓ "; color: var(--yesil); }
  .artilar span { color: var(--soluk); font-size: 13px; }
  .planlar { display: flex; flex-direction: column; gap: 10px; }
  .plan { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: var(--kart); border: 1.5px solid var(--kenar); border-radius: 16px; padding: 14px 16px; }
  .plan.one-cikan { border-color: #a371f7; }
  .plan em { color: #c297ff; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .plan strong { font-size: 17px; }
  .plan small { color: var(--yesil); }
  .plan:disabled { opacity: .5; }
  .yasal { margin: 0; color: var(--soluk); font-size: 12px; line-height: 1.5; }
  .yasal a { color: var(--soluk); }
  .dugme { text-align: center; text-decoration: none; }
  .dugme.ikincil { background: var(--kart); color: var(--yazi); border: 1px solid var(--kenar); }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 40; transform: translateX(-50%); background: #21262d; border: 1px solid var(--kenar); color: var(--yazi); border-radius: 999px; padding: 10px 16px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); transition: opacity .5s; max-width: calc(100% - 32px); }
  .toast.git { opacity: 0; }
  .katman { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; animation: belir .2s ease-out; }
  .katman-kart { position: relative; overflow: hidden; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #11161d; border: 1px solid var(--kenar); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: yuksel .3s cubic-bezier(.2, .8, .2, 1); }
  .katman-kart h2 { margin: 0; font-size: 24px; line-height: 1.2; }
  .katman-kart p { margin: 0; color: #c9d1d9; }
  .makale-baslik { font-style: italic; font-size: 20px !important; }
  .yazar { color: var(--soluk) !important; font-size: 14px; }
  .onem { background: var(--kart); border-radius: 12px; padding: 12px; }
  .ilgili { color: var(--mavi); text-decoration: none; }
  .kazanc { color: var(--yesil) !important; font-weight: 800; font-size: 18px; }
  .olay { font-weight: 600; }
  .tebrik-ik { width: 64px; height: 64px; margin: 4px auto 0 !important; border-radius: 50%; background: var(--yesil); color: #fff !important; display: grid; place-items: center; font-size: 34px; font-weight: 800; }
  .katman-kart:has(.tebrik-ik) { text-align: center; }
  .konfeti { position: absolute; inset: 0; pointer-events: none; }
  .konfeti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: dus 1.8s ease-in forwards; }
  .konfeti i:nth-child(3n) { background: var(--yesil); } .konfeti i:nth-child(3n+1) { background: var(--turuncu); } .konfeti i:nth-child(3n+2) { background: #a371f7; }
  .konfeti i:nth-child(1) { left: 0%; animation-delay: 0.00s; }
  .konfeti i:nth-child(2) { left: 37%; animation-delay: 0.12s; }
  .konfeti i:nth-child(3) { left: 74%; animation-delay: 0.24s; }
  .konfeti i:nth-child(4) { left: 11%; animation-delay: 0.36s; }
  .konfeti i:nth-child(5) { left: 48%; animation-delay: 0.48s; }
  .konfeti i:nth-child(6) { left: 85%; animation-delay: 0.60s; }
  .konfeti i:nth-child(7) { left: 22%; animation-delay: 0.00s; }
  .konfeti i:nth-child(8) { left: 59%; animation-delay: 0.12s; }
  .konfeti i:nth-child(9) { left: 96%; animation-delay: 0.24s; }
  .konfeti i:nth-child(10) { left: 33%; animation-delay: 0.36s; }
  .konfeti i:nth-child(11) { left: 70%; animation-delay: 0.48s; }
  .konfeti i:nth-child(12) { left: 7%; animation-delay: 0.60s; }
  .konfeti i:nth-child(13) { left: 44%; animation-delay: 0.00s; }
  .konfeti i:nth-child(14) { left: 81%; animation-delay: 0.12s; }
  .konfeti i:nth-child(15) { left: 18%; animation-delay: 0.24s; }
  .konfeti i:nth-child(16) { left: 55%; animation-delay: 0.36s; }
  .konfeti i:nth-child(17) { left: 92%; animation-delay: 0.48s; }
  .konfeti i:nth-child(18) { left: 29%; animation-delay: 0.60s; }
  @keyframes dus { to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
  @keyframes belir { from { opacity: 0; } }
  @keyframes yuksel { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .katman, .katman-kart, .konfeti i { animation: none; } .konfeti { display: none; } }
</style>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dersler | VisionCap</title>
<meta name="description" content="VisionCap derslerini tarayıcıda dene: canlı kamera görüntüsü üzerinde gri tonlama, eşikleme, bulanıklaştırma, kenar bulma ve daha fazlası; bilgi kartları ve makale özetleri.">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f0f6fc' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%233fb950'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="visioncap.css">
<style>
  :root { --mor: #a371f7; --kart2: #1b222c; }
  body { background: radial-gradient(900px 420px at 50% -160px, rgba(63, 185, 80, .10), transparent 70%), var(--zemin); }
  #uygulama { max-width: 560px; margin: 0 auto; padding: 0 16px 56px; display: flex; flex-direction: column; gap: 12px; }
  #uygulama h1 { font-size: 28px; margin: 4px 0 0; line-height: 1.15; letter-spacing: -.01em; }
  #uygulama h2 { font-size: 20px; margin: 14px 0 0; }
  #uygulama h2 small { color: var(--soluk); font-size: 14px; font-weight: 500; margin-left: 6px; }
  .alt-metin { margin: -4px 0 0; color: var(--soluk); }

  /* Ortak parçalar */
  .ik { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ik .dolu { fill: currentColor; stroke: none; }
  .kart { display: flex; flex-direction: column; gap: 4px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 18px; padding: 14px 16px; text-decoration: none; }
  .kart small, .adim small, .rozet small { color: var(--soluk); font-size: 13px; }
  button.kart { font: inherit; color: inherit; text-align: left; cursor: pointer; }
  a.kart, button.kart, a.adim, button.adim { transition: transform .12s, border-color .12s; }
  a.kart:active, button.kart:active, a.adim:active, button.adim:active, .plan:active { transform: scale(.98); }
  a.adim:hover, a.kart:hover { border-color: var(--soluk); }
  .kart-ic { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .kutu-ik, .mini-ik { display: grid; place-items: center; flex: none; border-radius: 14px; width: 46px; height: 46px; }
  .mini-ik { width: 34px; height: 34px; border-radius: 10px; }
  .mini-ik .ik { width: 18px; height: 18px; }
  .yesil { --r: var(--yesil); } .turuncu { --r: var(--turuncu); } .mavi { --r: var(--mavi); } .mor { --r: var(--mor); }
  .kutu-ik, .mini-ik { color: var(--r); background: color-mix(in srgb, var(--r) 16%, transparent); }
  .hap { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; background: var(--kart2); border: 1px solid var(--kenar); color: var(--yazi); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; }
  .hap .ik { width: 14px; height: 14px; }
  .hap.yesil { color: var(--yesil); border-color: color-mix(in srgb, var(--yesil) 40%, transparent); }
  .cubuk { display: block; height: 8px; background: var(--kenar); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .cubuk i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2ea043, #56d364); }
  .cubuk.ince { height: 5px; margin: 4px 0; }
  .salla .cubuk i { background: linear-gradient(90deg, #db6d28, #f0883e); }

  /* Bugün */
  .selam { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .selam small { color: var(--soluk); font-size: 13px; text-transform: capitalize; }
  .pro-rozet { background: linear-gradient(135deg, #8957e5, #a371f7); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .1em; padding: 4px 10px; border-radius: 999px; margin-bottom: 6px; }
  .seri-kart { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; background: linear-gradient(150deg, #3a1d0b 0%, #1d140f 55%, var(--kart) 100%); border: 1px solid #5a3214; display: flex; flex-direction: column; gap: 14px; }
  .seri-ust { display: flex; align-items: center; gap: 14px; }
  .seri-ust strong { display: block; font-size: 52px; line-height: 1; font-weight: 800; color: #ffb36b; font-variant-numeric: tabular-nums; }
  .seri-ust small { color: #e6c3a3; font-size: 14px; }
  .alev { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: rgba(240, 136, 62, .18); color: var(--turuncu); }
  .alev .ik { width: 38px; height: 38px; filter: drop-shadow(0 0 10px rgba(240, 136, 62, .6)); }
  .alev.sonuk { color: #6e5442; } .alev.sonuk .ik { filter: none; }
  .hafta { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .hafta span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hafta i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .06); border: 1.5px dashed rgba(255, 255, 255, .14); }
  .hafta .dolu i { background: var(--turuncu); border: 0; color: #fff; }
  .hafta .ik { width: 16px; height: 16px; }
  .hafta .bugun i { box-shadow: 0 0 0 2px #1d140f, 0 0 0 4px var(--turuncu); }
  .hafta small { font-size: 11px; color: #c9a487; }
  .seri-kart p { margin: 0; color: #e6c3a3; font-size: 14px; }
  .uclu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sayac { gap: 2px; }
  .sayac .mini-ik { margin-bottom: 6px; }
  .sayac strong { font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .seviye-kart { gap: 6px; }
  .seviye-ust { display: flex; align-items: center; gap: 12px; }
  .seviye-ust > span { display: flex; flex-direction: column; }
  .sv { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; font-weight: 800; color: #0b0f14; background: linear-gradient(135deg, #56d364, #2ea043); box-shadow: 0 0 0 3px rgba(63, 185, 80, .2); }
  .gorev { border-color: color-mix(in srgb, var(--mavi) 55%, transparent); background: linear-gradient(150deg, #0f2240, var(--kart) 70%); gap: 8px; }
  .gorev-ust { display: flex; align-items: center; gap: 12px; }
  .gorev-ust > span:last-child { display: flex; flex-direction: column; }
  .ders-no { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #388bfd, #1f6feb); }
  .gorev em, .ipucu em, .formul em { color: #79b8ff; font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
  .gorev strong { font-size: 18px; }
  .gorev .hap { background: var(--mavi); border-color: var(--mavi); color: #fff; letter-spacing: 0; font-size: 13px; padding: 6px 12px; }
  .salla, .pro-bant, .hatirlatma { flex-direction: row; align-items: center; gap: 14px; }
  .salla { border-color: color-mix(in srgb, var(--turuncu) 55%, transparent); background: linear-gradient(150deg, #2c1a0e, var(--kart) 70%); }
  .salla em, .etiket, .onem em { color: var(--turuncu); font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
  .salla-ik .ik { animation: titre 2.4s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes titre { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 82% { transform: rotate(12deg); } 89% { transform: rotate(-8deg); } 95% { transform: rotate(5deg); } }
  .pro-bant { border-color: color-mix(in srgb, var(--mor) 60%, transparent); background: linear-gradient(135deg, #2a1a4a, #171226 60%, var(--kart)); }
  .pro-bant em, .pro-ust em { color: #c297ff; font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .08em; }
  .anahtar { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--kenar); position: relative; transition: background .2s; }
  .anahtar i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .anahtar.acik { background: var(--yesil); } .anahtar.acik i { transform: translateX(20px); }
  .akis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .akis li { display: flex; align-items: center; gap: 12px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 14px; padding: 10px 12px; }
  .akis i { font-style: normal; font-size: 18px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--kart2); flex: none; }
  .akis span { flex: 1; }
  .akis small, .bos { color: var(--soluk); font-size: 12px; }
  .tumu { color: var(--mavi); text-decoration: none; font-size: 15px; }

  /* Dersler */
  .ozet-kart strong { font-size: 17px; }
  .bolum { display: flex; align-items: baseline; }
  .yol { display: flex; flex-direction: column; gap: 10px; }
  .adim { position: relative; display: flex; align-items: center; gap: 12px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 16px; padding: 12px 14px; text-decoration: none; }
  .adim > i { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; background: var(--kart2); border: 2px solid var(--kenar); color: var(--soluk); }
  .adim > i .ik { width: 18px; height: 18px; }
  .yol:not(.makaleler) .adim:not(:last-child) > i::after { content: ""; position: absolute; left: 50%; top: calc(100% + 2px); width: 2px; height: 26px; margin-left: -1px; background: var(--kenar); }
  .adim.bitti > i { background: var(--yesil); border-color: var(--yesil); color: #fff; }
  .yol:not(.makaleler) .adim.bitti:not(:last-child) > i::after { background: var(--yesil); }
  .adim.simdi { border-color: var(--yesil); box-shadow: 0 0 0 3px rgba(63, 185, 80, .15); }
  .adim.simdi > i { border-color: var(--yesil); color: var(--yesil); }
  .adim.simdi .hap { margin-left: auto; align-self: center; color: var(--yesil); border-color: color-mix(in srgb, var(--yesil) 40%, transparent); }
  .adim > span { display: flex; flex-direction: column; min-width: 0; }
  .adim strong { line-height: 1.3; }
  .adim > .ik { margin-left: auto; color: var(--soluk); width: 18px; height: 18px; }
  .kilitli { opacity: .45; }
  .pro-cip { margin-left: auto; flex: none; background: #2a1f45; color: #c297ff; font-size: 11px; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; }
  .adim.pro-kilit > i { color: #c297ff; border-color: #3d2d63; }
  button.adim { font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; }
  .makale > i { width: 52px; border-radius: 12px; font-size: 13px; }

  /* Ders ekranı */
  .geri-ic { color: var(--mavi); text-decoration: none; font-size: 17px; }
  .ders-ust { display: flex; gap: 8px; margin: 0; }
  .anlatim { margin: 0; color: #c9d1d9; }
  .formul { display: flex; flex-direction: column; gap: 4px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 14px; padding: 12px 14px; color: var(--turuncu); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .formul em { font-family: Inter, system-ui, sans-serif; color: var(--soluk); }
  .sahne { position: relative; border-radius: 20px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  .sahne canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .durum { position: absolute; left: 12px; right: 12px; bottom: 12px; margin: 0; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .durum:empty { display: none; }
  .kucuk { margin: -4px 0 0; color: var(--soluk); font-size: 12px; text-align: center; }
  .ayarlar { display: flex; flex-direction: column; gap: 10px; }
  .ayar { display: flex; flex-direction: column; gap: 6px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 14px; padding: 12px 14px; }
  .ayar span { display: flex; justify-content: space-between; }
  .ayar output { color: var(--yesil); font-variant-numeric: tabular-nums; font-weight: 700; }
  .ayar input { width: 100%; accent-color: var(--yesil); }
  .ipucu { background: linear-gradient(150deg, #0f2240, var(--kart) 70%); border: 1px solid color-mix(in srgb, var(--mavi) 40%, transparent); border-radius: 14px; padding: 12px 14px; }
  .ipucu p { margin: 4px 0 0; color: #c9d1d9; }
  .dugme { font: inherit; font-weight: 700; color: #fff; background: linear-gradient(180deg, #46c35a, #2ea043); border: 0; border-radius: 16px; padding: 15px; cursor: pointer; text-align: center; text-decoration: none; box-shadow: 0 6px 18px rgba(46, 160, 67, .25); }
  .dugme:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .dugme.tamam { background: transparent; color: var(--yesil); opacity: 1; box-shadow: none; }
  .dugme.ikincil { background: var(--kart); color: var(--yazi); border: 1px solid var(--kenar); box-shadow: none; }
  .not-web { color: var(--soluk); font-size: 13px; text-align: center; margin: 8px 0 0; }
  /* iOS uygulamasında tanıtım bağlantısı gizlenir, alt bilgi kalır (gizlilik ve destek) */
  .native .ust .geri, .native .not-web { display: none; }
  .native .ust { padding-top: max(22px, env(safe-area-inset-top)); }

  /* Sekmeler */
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .sekmeler { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(11, 15, 20, .9); border-top: 1px solid var(--kenar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .sekmeler[hidden] { display: none; }
  .sekmeler a { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--soluk); text-decoration: none; font-size: 11px; font-weight: 600; }
  .sekmeler svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sekmeler a.secili { color: var(--yesil); }
  .sekmeler a.secili svg { filter: drop-shadow(0 0 6px rgba(63, 185, 80, .5)); }

  /* Kartlar */
  .tur-lejant { display: flex; gap: 8px; flex-wrap: wrap; margin-top: -4px; }
  .tur-lejant span { font-size: 12px; color: var(--r); background: color-mix(in srgb, var(--r) 12%, transparent); padding: 3px 10px; border-radius: 999px; }
  .kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .mini { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 104px; background: linear-gradient(160deg, color-mix(in srgb, var(--r, var(--turuncu)) 14%, var(--kart)), var(--kart) 65%); border: 1px solid color-mix(in srgb, var(--r, var(--turuncu)) 35%, var(--kenar)); border-radius: 16px; padding: 12px; }
  .mini-ust { display: flex; justify-content: space-between; align-items: center; }
  .mini em { color: var(--r); font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .mini b { font-size: 18px; }
  .mini strong { font-size: 15px; line-height: 1.3; }
  .mini.kapali { align-items: center; justify-content: center; gap: 2px; cursor: default; background: repeating-linear-gradient(135deg, var(--kart), var(--kart) 10px, #121820 10px, #121820 20px); border: 1px dashed var(--kenar); }
  .mini.kapali strong { font-size: 26px; color: #3a4350; }
  .mini.kapali small { font-size: 11px; color: #4d5764; }

  /* Gelişim */
  .sayaclar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .baslik-satir { display: flex; justify-content: space-between; align-items: baseline; }
  .grafik { display: flex; align-items: flex-end; gap: 8px; height: 140px; margin: 10px 0 0; }
  .grafik div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .grafik b { font-size: 11px; color: var(--soluk); font-weight: 600; }
  .grafik span { width: 100%; min-height: 4px; background: color-mix(in srgb, var(--yesil) 45%, var(--kart)); border-radius: 8px 8px 3px 3px; }
  .grafik .bugun span { background: linear-gradient(180deg, #56d364, #2ea043); box-shadow: 0 0 14px rgba(63, 185, 80, .35); }
  .grafik .bugun b, .grafik .bugun small { color: var(--yesil); }
  .grafik small { font-size: 11px; }
  .rozetler { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .rozet { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: var(--kart); border: 1px solid color-mix(in srgb, var(--yesil) 45%, var(--kenar)); border-radius: 16px; padding: 12px 8px; }
  .rozet strong { font-size: 13px; line-height: 1.25; margin-top: 4px; }
  .rozet small { font-size: 11px !important; line-height: 1.3; }
  .madalya { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: radial-gradient(circle at 35% 30%, #ffe8a3, #e3b341 55%, #9e6a03); box-shadow: 0 4px 14px rgba(227, 179, 65, .3); }
  .rozet.kilitli { opacity: 1; border-color: var(--kenar); }
  .rozet.kilitli .madalya { background: var(--kart2); box-shadow: none; filter: grayscale(1); opacity: .45; }
  .rozet.kilitli strong { color: var(--soluk); }
  .rozet .cubuk { width: 80%; }
  .rozet .sayi { font-size: 10px !important; }

  /* Pro */
  .pro-ust { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 8px 0 4px; }
  .pro-ust h1 { margin-top: 2px !important; }
  .pro-amblem { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; align-self: center; color: #fff; background: linear-gradient(135deg, #8957e5, #a371f7 50%, #d2a8ff); box-shadow: 0 10px 30px rgba(163, 113, 247, .35); margin-bottom: 6px; }
  .pro-amblem .ik { width: 38px; height: 38px; }
  .artilar { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .artilar li { display: flex; align-items: center; gap: 12px; background: var(--kart); border: 1px solid var(--kenar); border-radius: 14px; padding: 12px 14px; }
  .artilar li > span:last-child { display: flex; flex-direction: column; }
  .artilar small { color: var(--soluk); font-size: 13px; }
  .planlar, .plan-liste { display: flex; flex-direction: column; gap: 10px; }
  .plan { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; background: var(--kart); border: 1.5px solid var(--kenar); border-radius: 18px; padding: 14px 16px; transition: border-color .15s, background .15s; }
  .plan.secili { border-color: var(--mor); background: linear-gradient(135deg, #241640, var(--kart) 70%); }
  .secim { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--kenar); }
  .plan.secili .secim { border: 6px solid var(--mor); background: #fff; }
  .plan-ad { flex: 1; display: flex; flex-direction: column; }
  .plan-ad strong { font-size: 17px; }
  .plan-ad em { align-self: flex-start; color: #fff; background: var(--mor); font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; margin-top: 2px; }
  .plan-ad small { color: var(--yesil); font-size: 13px; }
  .plan-fiyat { display: flex; flex-direction: column; align-items: flex-end; }
  .plan-fiyat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .plan-fiyat small { color: var(--soluk); font-size: 12px; }
  .plan:disabled { opacity: .5; }
  .pro-dugme { background: linear-gradient(135deg, #8957e5, #a371f7); box-shadow: 0 8px 22px rgba(163, 113, 247, .35); font-size: 17px; }
  .plan-not { margin: 0; }
  .yasal { margin: 0; color: var(--soluk); font-size: 12px; line-height: 1.5; }
  .yasal a { color: var(--soluk); }

  /* Bildirim ve katman */
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); z-index: 40; transform: translateX(-50%); background: #21262d; border: 1px solid var(--kenar); color: var(--yazi); border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .5s; max-width: calc(100% - 32px); animation: in .35s cubic-bezier(.2, .8, .2, 1); }
  .toast.git { opacity: 0; }
  @keyframes in { from { transform: translate(-50%, -20px); opacity: 0; } }
  .katman { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: belir .2s ease-out; }

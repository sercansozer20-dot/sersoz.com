<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SERSOZ</title>
<meta name="description" content="Elif'in Dolabı, VisionCap, MecaLib ve Sercan'ın Projeleri.">
<meta name="theme-color" content="#f5f3ef">
<link rel="canonical" href="https://sersoz.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317191c'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d9480f'/%3E%3Cpath d='M6 37.5 58 26.5' stroke='%23d9480f' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Giriş: "Kim giriyor?" profil seçimi. Bu sayfa giris.css'e bağlı değil. */
  :root { --ana: #d9480f; --metin: #1f2328; --ikinci: #6b6f76; --zemin: #f5f3ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center;
    background: var(--zemin); color: var(--metin); font: 16px/1.5 "Barlow", "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  .logo { margin-top: 32px; }
  .wm { display: inline-flex; align-items: center; font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 900; font-size: 24px; line-height: 1; }
  .wm .mercek { position: relative; display: inline-block; width: .8em; height: .8em; margin: 0 .035em; border: .15em solid currentColor; border-radius: 50%; }
  .wm .mercek::before { content: ""; position: absolute; inset: 0; margin: auto; width: .22em; height: .22em; border-radius: 50%; background: var(--ana); }
  .wm .mercek::after { content: ""; position: absolute; left: -.42em; right: -.42em; top: 50%; height: .055em; transform: translateY(-50%) rotate(-12deg); background: var(--ana); }

  main { flex: 1; width: 100%; max-width: 1100px; padding: 24px 20px 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { margin: 0 0 6px; font-family: "Archivo", sans-serif; font-stretch: 112%; font-weight: 800; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.01em; text-align: center; }
  .alt-baslik { margin: 0 0 44px; color: var(--ikinci); text-align: center; }

  /* Kapılar yan yana sarılır; yeni bir kapı eklemek için yalnız <a class="profil"> eklemek yeter. */
  .profiller { display: flex; flex-wrap: wrap; gap: 40px clamp(24px, 4vw, 44px); justify-content: center; width: 100%; }
  .profil { width: 180px; display: flex; flex-direction: column; align-items: center; text-align: center; outline: none; }
  .resim {
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden;
    display: grid; place-items: center; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .35);
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
  }
  .resim::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 0 #fff; transition: box-shadow .25s; }
  .profil:hover .resim, .profil:focus-visible .resim { transform: translateY(-6px) scale(1.03); box-shadow: 0 22px 40px -14px rgba(0, 0, 0, .4); }
  .profil:hover .resim::after, .profil:focus-visible .resim::after { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .9); }
  .profil:focus-visible .resim { outline: 3px solid var(--ana); outline-offset: 4px; }

  .elif { background: linear-gradient(145deg, #f3d6cf 0%, #d99a90 55%, #a8625d 100%); }
  .elif .harf { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(84px, 13vw, 128px); color: #fff8f5; line-height: 1; transform: translateY(-4%); }
  .visioncap { background: radial-gradient(120% 100% at 30% 15%, #1d2b24 0%, #0b0f14 70%); }
  .visioncap svg { width: 58%; height: 58%; }
  .mecalib { background: radial-gradient(110% 90% at 30% 20%, #24384a 0%, #0f1720 75%); }
  .mecalib svg { width: 62%; height: auto; }
  .sercan { background: #15171a; }
  .sercan img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
  .sercan .harf { position: relative; font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 900; font-size: clamp(76px, 12vw, 116px); color: #fff; line-height: 1; }
  .sercan .harf i { color: var(--ana); font-style: normal; }

  .ad { margin-top: 18px; font-weight: 700; font-size: 20px; }
  .tanim { margin-top: 2px; font-size: 14px; color: var(--ikinci); }
  .gir { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #d6d2ca; font-weight: 600; font-size: 14px; transition: background .2s, color .2s, border-color .2s; }
  .gir::after { content: "→"; transition: transform .2s; }
  .profil:hover .gir, .profil:focus-visible .gir { background: var(--metin); border-color: var(--metin); color: #fff; }
  .profil:hover .gir::after { transform: translateX(3px); }

  footer { padding: 18px; font-size: 12px; color: var(--ikinci); }

  @media (max-width: 640px) {
    .profiller { gap: 26px 16px; }
    .profil { width: calc(50% - 8px); }
  }
  @media (max-width: 480px) {
    .resim { border-radius: 22px; }
    .ad { font-size: 17px; line-height: 1.25; margin-top: 12px; }
    .tanim { font-size: 12.5px; }
    .alt-baslik { margin-bottom: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .resim, .gir { transition: none; } }
</style>
</head>
<body>

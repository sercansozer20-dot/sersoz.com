<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ürün | SERSOZ</title>
<meta name="description" content="SERSOZ ürün sayfası.">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8590c'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='40' font-weight='900' fill='%23fff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="magaza.css">
</head>
<body>
<a class="atla" href="#icerik">İçeriğe atla</a>
<header id="ust"></header>

<main class="kap" id="icerik">
  <nav class="iz" aria-label="Konum"><a href="index.html">Ana Sayfa</a> › <a id="izKat" href="kategori.html?liste=hepsi">Ürünler</a> › <span id="izAd"></span></nav>
  <div id="urun"></div>
  <section class="bolum" aria-labelledby="benzerBas" id="benzerBolum">
    <div class="bolum-bas"><h2 id="benzerBas">Benzer Ürünler</h2><a id="benzerTum" href="kategori.html?liste=hepsi">Tümünü gör</a></div>
    <div class="izgara" id="benzer"></div>
  </section>
</main>

<footer id="alt"></footer>

<script src="ayarlar.js"></script>
<script src="urunler.js"></script>
<script src="urunler-ornek.js"></script>
<script src="magaza.js"></script>
<script>
(function () {
  'use strict';
  var M = window.Magaza, A = M.ayar, I = M.ikon, esc = M.esc;
  var u = M.bul(new URLSearchParams(location.search).get('id'));
  var kap = document.getElementById('urun');

  if (!u) {
    document.title = 'Ürün bulunamadı | SERSOZ';
    document.getElementById('izAd').textContent = 'Bulunamadı';
    kap.innerHTML = '<div class="panel" style="text-align:center;padding:48px 20px"><h1 style="font-size:22px;margin-bottom:8px">Ürün bulunamadı</h1><p class="kucuk" style="margin-bottom:18px">Ürün satıştan kaldırılmış ya da bağlantı hatalı olabilir.</p><a class="dug dug-ana" href="index.html">Ana sayfaya dön</a></div>';
    document.getElementById('benzerBolum').hidden = true;
    return;
  }

  var kat = M.kategori(u.kategori);
  document.title = u.ad + ' | SERSOZ';
  document.querySelector('meta[name=description]').setAttribute('content', u.ad + '. ' + (u.kisa || '') + ' Fiyat: ' + M.tl(u.fiyat));
  if (kat) { var ik = document.getElementById('izKat'); ik.textContent = kat.ad; ik.href = M.katLink(kat.id); }
  document.getElementById('izAd').textContent = u.ad;

  var y = M.indirim(u);
  var k = A.kargo || {};
  var tablo = [['Ürün kodu', u.kod]].concat(kat ? [['Kategori', kat.ad]] : []).concat(u.bilgi || []);
  var stokYazi = u.tur === 'urun' ? (u.stok === 0 ? 'Tükendi' : 'Stokta') : 'Satışta';
  var soruLink = A.whatsapp
    ? 'https://wa.me/' + esc(A.whatsapp) + '?text=' + encodeURIComponent(u.kod + ' - ' + u.ad + ' hakkında bilgi almak istiyorum.')
    : 'mailto:' + esc(A.eposta) + '?subject=' + encodeURIComponent(u.kod + ' - ' + u.ad);

  kap.innerHTML =
    '<div class="urun-ust">' +
      '<div class="urun-gorsel">' + M.rozetler(u) + M.gorsel(u) + '</div>' +
      '<div class="urun-bilgi">' +
        '<h1>' + esc(u.ad) + '</h1>' +
        '<div class="urun-meta"><span>Ürün kodu: <b>' + esc(u.kod) + '</b></span>' +
          (kat ? '<span>Kategori: <a href="' + M.katLink(kat.id) + '"><b>' + esc(kat.ad) + '</b></a></span>' : '') +
          '<span>Durum: <b class="stokta">' + stokYazi + '</b></span></div>' +
        '<div class="fiyat-kutu' + (y ? ' indirimli' : '') + '">' +
          (y ? '<div class="eski"><s>' + M.tl(u.eskiFiyat) + '</s><span class="indirim-yazi">%' + y + ' indirim</span></div>' : '') +
          '<div class="simdi">' + M.tl(u.fiyat) + '</div>' +
          '<div class="kucuk">' + (A.kdvOrani ? 'KDV hariç' : 'Ek ücret yoktur') + '</div>' +
        '</div>' +
        (u.kisa ? '<p class="kisa">' + esc(u.kisa) + '</p>' : '') +
        '<div class="satin-al">' +
          '<span class="adet adet-buyuk" role="group" aria-label="Adet"><button type="button" id="adetAz" aria-label="Azalt">−</button><span id="adetDeger">1</span><button type="button" id="adetArt" aria-label="Arttır">+</button></span>' +
          '<button type="button" class="dug dug-ana dug-buyuk" data-ekle="' + esc(u.id) + '" data-adet-alan="adetDeger">' + I.sepet + 'Sepete Ekle</button>' +
        '</div>' +
        '<button type="button" class="dug dug-koyu dug-tam" id="hemenAl" style="height:46px;font-weight:700">Hemen Al</button>' +
        (u.ornek ? '<p class="ornek-uyari">Bu bir <b>örnek üründür</b>; mağazanın görünümünü göstermek için eklendi ve şu an satışta değildir.</p>' : '') +
        '<div class="urun-ozellik">' +
          '<div>' + I.kamyon + '<span><b>Teslimat</b>' + esc(u.teslimKisa || 'Stokta') + '</span></div>' +
          '<div>' + I.kalkan + '<span><b>Güvenli ödeme</b>Havale/EFT' + (u.shopier ? ', kart' : '') + '</span></div>' +
          (u.tur === 'urun' && k.ucretsizEsik ? '<div>' + I.kredi + '<span><b>Ücretsiz kargo</b>' + M.tl(k.ucretsizEsik).replace(',00', '') + ' üzeri</span></div>' : '') +
          '<div>' + I.mesaj + '<span><b>Soru sor</b><a href="' + soruLink + '" style="text-decoration:underline">Satıcıya yazın</a></span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="sekmeler">' +
      '<div class="sekme-bas" role="tablist">' +
        '<button type="button" role="tab" id="s1" aria-selected="true" aria-controls="p1">Ürün Açıklaması</button>' +
        '<button type="button" role="tab" id="s2" aria-selected="false" aria-controls="p2" tabindex="-1">Teknik Özellikler</button>' +
        '<button type="button" role="tab" id="s3" aria-selected="false" aria-controls="p3" tabindex="-1">Teslimat ve İade</button>' +
      '</div>' +
      '<div class="sekme-govde" role="tabpanel" id="p1" aria-labelledby="s1">' +
        '<p>' + esc(u.aciklama || u.kisa) + '</p>' +
        (u.maddeler && u.maddeler.length ? '<ul>' + u.maddeler.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>' +
      '<div class="sekme-govde" role="tabpanel" id="p2" aria-labelledby="s2" hidden>' +
        '<table class="ozellik-tablo"><tbody>' + tablo.map(function (r) { return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>' +
      '</div>' +
      '<div class="sekme-govde" role="tabpanel" id="p3" aria-labelledby="s3" hidden>' +
        '<p>' + esc(u.teslim || u.teslimKisa || 'Sipariş sonrası e-postayla bilgilendirilirsiniz.') + '</p>' +
        '<p style="margin-top:10px">' + (u.tur === 'urun'
          ? 'Fiziksel ürünlerde teslimden itibaren 14 gün içinde iade hakkınız vardır.'
          : 'Teslim edilmiş dijital ürünlerde ve başlamış hizmetlerde yasa gereği cayma hakkı bulunmaz.') +
        ' Ayrıntılar için <a href="kosullar.html#iade" style="text-decoration:underline">iade koşullarına</a> bakın.</p>' +
      '</div>' +
    '</div>';

  var adet = document.getElementById('adetDeger');
  document.getElementById('adetAz').onclick = function () { adet.textContent = Math.max(1, +adet.textContent - 1); };
  document.getElementById('adetArt').onclick = function () { adet.textContent = Math.min(99, +adet.textContent + 1); };
  document.getElementById('hemenAl').onclick = function () { M.sepet.ekle(u.id, +adet.textContent); location.href = 'sepet.html'; };

  var sekmeler = kap.querySelectorAll('[role=tab]');
  function sec(t) {
    sekmeler.forEach(function (b) {
      var on = b === t;
      b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
      document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
    });
    t.focus();
  }
  kap.querySelector('[role=tablist]').addEventListener('click', function (e) { var t = e.target.closest('[role=tab]'); if (t) sec(t); });
  kap.querySelector('[role=tablist]').addEventListener('keydown', function (e) {
    var i = Array.prototype.indexOf.call(sekmeler, document.activeElement);
    if (e.key === 'ArrowRight') sec(sekmeler[(i + 1) % sekmeler.length]);
    if (e.key === 'ArrowLeft') sec(sekmeler[(i - 1 + sekmeler.length) % sekmeler.length]);
  });

  var benzer = M.urunler.filter(function (x) { return x.id !== u.id && x.kategori === u.kategori; });
  if (benzer.length < 5) benzer = benzer.concat(M.urunler.filter(function (x) { return x.id !== u.id && x.kategori !== u.kategori && x.vitrin; }));
  document.getElementById('benzer').innerHTML = benzer.slice(0, 5).map(M.kart).join('');
  if (kat) document.getElementById('benzerTum').href = M.katLink(kat.id);
})();
</script>
</body>
</html>

<head>

<title>Sercan'ın Projeleri | SERSOZ</title>
<meta name="description" content="Sercan Sözer'in projeleri: elektronik market, 3D makine görüşü ve robotik.">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317191c'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d9480f'/%3E%3Cpath d='M6 37.5 58 26.5' stroke='%23d9480f' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,900&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Apple ürün sayfaları tarzı bento ızgara. */
  :root { --ana: #d9480f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #f5f5f7; color: #1d1d1f; font: 16px/1.5 "Inter", "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 24px clamp(16px, 5vw, 64px); max-width: 1230px; width: 100%; margin: 0 auto; }
  .geri { font-size: 14px; color: #6e6e73; }
  .geri:hover { color: #1d1d1f; }
  .wm { display: inline-flex; align-items: center; font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1; }
  .wm .mercek { position: relative; display: inline-block; width: .8em; height: .8em; margin: 0 .035em; border: .15em solid currentColor; border-radius: 50%; }
  .wm .mercek::before { content: ""; position: absolute; inset: 0; margin: auto; width: .22em; height: .22em; border-radius: 50%; background: var(--ana); }
  .wm .mercek::after { content: ""; position: absolute; left: -.42em; right: -.42em; top: 50%; height: .055em; transform: translateY(-50%) rotate(-12deg); background: var(--ana); }

  main { flex: 1; width: 100%; max-width: 1230px; margin: 0 auto; padding: 16px clamp(16px, 5vw, 64px) 56px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-weight: 600; font-size: clamp(32px, 4.5vw, 56px); letter-spacing: -.02em; line-height: 1.1; margin: 0 0 32px; }

  .bento { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; min-height: 560px; }
  .kutu { position: relative; border-radius: 28px; overflow: hidden; padding: 30px; display: flex; flex-direction: column; justify-content: flex-end; background: #fff; transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
  a.kutu:hover { transform: scale(1.015); }
  a.kutu:focus-visible { outline: 3px solid #0071e3; outline-offset: 3px; }
  .kutu h2 { margin: 0; font-size: clamp(22px, 2.4vw, 32px); font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
  .kutu p { margin: 6px 0 0; color: #6e6e73; font-size: 15px; }
  .kutu .dg { margin-top: 14px; color: #0066cc; font-weight: 500; font-size: 15px; }
  .kutu .dg::after { content: " ›"; }
  a.kutu:hover .dg { text-decoration: underline; }

  .k-market { grid-row: span 2; background: linear-gradient(180deg, #fff 0%, #fff 45%, #ffe8dc 100%); }
  .k-market svg { flex: none; width: 96px; height: auto; margin-bottom: auto; padding-bottom: 24px; color: var(--ana); }
  .k-market h2 { font-size: clamp(30px, 3.6vw, 48px); }
  .k-gorus { background: #000; color: #f5f5f7; }
  .k-gorus img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .7; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  .k-gorus:hover img { transform: scale(1.05); }
  .k-gorus > :not(img) { position: relative; }
  .k-gorus p { color: #a1a1a6; }
  .k-gorus .dg { color: #2997ff; }
  .k-robot p::before { content: "Yakında · "; color: #bf4800; font-weight: 600; }

  footer { padding: 18px; font-size: 12px; color: #86868b; text-align: center; }

  @media (max-width: 760px) {
    .bento { grid-template-columns: 1fr; grid-template-rows: none; min-height: 0; }
    .k-market { grid-row: auto; min-height: 300px; }
    .k-market svg { width: 64px; }
    .kutu { min-height: 220px; }
  }
  @media (prefers-reduced-motion: reduce) { .kutu, .k-gorus img { transition: none; } }
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="SERSOZ ana sayfa"><span class="wm" aria-hidden="true">SERS<span class="mercek"></span>Z</span></a>
  <a class="geri" href="index.html">← Profil seçimi</a>
</header>

<main>
  <h1>Sercan'ın Projeleri.</h1>
  <div class="bento">
    <a class="kutu k-market" href="magaza.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      <h2>Elektronik Market</h2>
      <p>Geliştirme kartları, sensörler, motorlar ve ölçüm aletleri.</p>
      <span class="dg">Markete gir</span>
    </a>
    <a class="kutu k-gorus" href="kategori.html?k=makine-gorusu">

      <p>Tarama, ölçüm, kusur tespiti, PLC.</p>
      <span class="dg">Çözümleri gör</span>
    </a>
    <div class="kutu k-robot">
      <h2>Robotik Projeler</h2>
      <p>Robot kol ve dört ayaklı robot.</p>
    </div>
  </div>
</main>

<footer>© <span id="yil"></span> SERSOZ · Sercan Sözer</footer>

</body>
</html>
